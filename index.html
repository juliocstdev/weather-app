<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="container">
      <form id="search">
        <i class="fa-solid fa-location-dot"></i>
        <input
          type="search"
          name="cityName"
          id="cityName"
          placeholder="Buscar cidade"
        />
        <button type="submit">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>

      <div id="weather" class="hide">
        <h1 id="title"></h1>

        <div id="infos">
          <div id="temp">
            <img id="tempImg" />
            <div>
              <p id="tempValue"></p>
              <p id="tempDescription"></p>
            </div>
          </div>

          <div id="otherInfos">
            <div class="info">
              <i id="tempMaxIcon" class="fa-solid fa-temperature-high"></i>

              <div>
                <h2>Temp. Max</h2>

                <p id="tempMax"></p>
              </div>
            </div>

            <div class="info">
              <i id="tempMinIcon" class="fa-solid fa-temperature-low"></i>

              <div>
                <h2>Temp. Min</h2>

                <p id="tempMin"></p>
              </div>
            </div>

            <div class="info">
              <i id="humidityIcon" class="fa-solid fa-droplet"></i>

              <div>
                <h2>Humidity</h2>

                <p id="humidity"></p>
              </div>
            </div>

            <div class="info">
              <i id="windIcon" class="fa-solid fa-wind"></i>

              <div>
                <h2>Vento</h2>

                <p id="windy"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="alert" class="hide"></div>
    </div>
  </body>
</html>
